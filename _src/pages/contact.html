description: Request a free quote for glass, mirrors and glass industry accessories. Call 437-477-8897 or visit 1110-250 Consumers Road, Toronto.
nav: contact

  <section class="page-hero" aria-labelledby="page-title">
    <img class="hero-bg" data-c-src="hero_image" alt="">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-ui="nav_home">Home</a><span aria-hidden="true">/</span><span data-ui="nav_contact">Contact</span></nav>
      <h1 id="page-title" data-c="hero_title"></h1>
      <p data-c="hero_text"></p>
    </div>
  </section>

  <section class="sec" id="quote" aria-labelledby="form-title">
    <div class="container contact-grid">
      <div class="contact-side reveal">
        <a class="info-card" data-set="phone-link-card"></a>
        <a class="info-card" data-set="email-link-card"></a>
        <a class="info-card" data-set="address-card" target="_blank" rel="noopener"></a>
        <div class="map-frame" id="map"></div>
      </div>

      <form class="quote-form reveal" id="quote-form" novalidate>
        <h2 class="h-up" id="form-title" data-c="form_title"></h2>
        <p class="form-intro" data-c="form_intro"></p>
        <fieldset class="seg">
          <legend class="sr-only" data-ui="form_type_quote"></legend>
          <label><input type="radio" name="type" value="Quote" checked><span data-ui="form_type_quote"></span></label>
          <label><input type="radio" name="type" value="Consultation"><span data-ui="form_type_consult"></span></label>
          <label><input type="radio" name="type" value="Question"><span data-ui="form_type_question"></span></label>
        </fieldset>
        <div class="row">
          <div class="field"><label for="f-name"><span data-ui="form_name"></span> <em>*</em></label><input id="f-name" name="name" required autocomplete="name"></div>
          <div class="field"><label for="f-company" data-ui="form_company"></label><input id="f-company" name="company" autocomplete="organization"></div>
        </div>
        <div class="row">
          <div class="field"><label for="f-email"><span data-ui="form_email"></span> <em>*</em></label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
          <div class="field"><label for="f-phone" data-ui="form_phone"></label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
        </div>
        <div class="field">
          <span class="label" data-ui="form_items"></span>
          <div class="picked" id="picked"></div>
        </div>
        <div class="field">
          <label for="f-msg" data-ui="form_message"></label>
          <textarea id="f-msg" name="message" rows="5" data-ui-ph="form_message_ph"></textarea>
        </div>
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn btn-brand btn-block" type="submit" data-ui="form_send">Send request</button>
        <p class="form-status" id="form-status" role="status" hidden></p>
      </form>
    </div>
  </section>

  <section class="sec sec-gray" aria-labelledby="steps-title">
    <div class="container">
      <h2 class="h-up center reveal" id="steps-title" data-c="steps_title"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="sec" aria-labelledby="faq-title">
    <div class="container faq-wrap">
      <h2 class="h-up center reveal" id="faq-title" data-c="faq_title"></h2>
      <div class="faq" id="faq"></div>
    </div>
  </section>
