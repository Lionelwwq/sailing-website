description: Architectural glass, mirrors and accessories for manufacturers, fabricators and distributors. Reliable international supply with dedicated support from inquiry to delivery.
nav: home

<link rel="stylesheet" href="assets/css/home-door.css">
  <!-- Home: just the cover, clean: Sailing's front door, the title, one line of text and "Explore Products", which walks
       through the glass doors into the showroom photo (showroom.html), where the products are.
       Door pictures made with _src/make_home_entrance.py; walk-in in assets/js/home-door.js -->
  <section class="door" id="door" aria-labelledby="hero-title">
    <!-- the same shot by day, at dusk and early at night (lined up): the dusk and night layers slowly fade in and out -->
    <div class="door-photo">
      <picture>
        <source media="(max-width: 760px)" srcset="assets/img/site/front-entrance-m.jpg">
        <img class="dp-day" src="assets/img/site/front-entrance.jpg" alt="" width="3200" height="1800" fetchpriority="high">
      </picture>
      <picture>
        <source media="(max-width: 760px)" srcset="assets/img/site/front-entrance-dusk-m.jpg">
        <img class="dp-dusk" src="assets/img/site/front-entrance-dusk.jpg" alt="" width="3200" height="1800" fetchpriority="low" decoding="async">
      </picture>
      <picture>
        <source media="(max-width: 760px)" srcset="assets/img/site/front-entrance-night-m.jpg">
        <img class="dp-night" src="assets/img/site/front-entrance-night.jpg" alt="" width="3200" height="1800" fetchpriority="low" decoding="async">
      </picture>
    </div>
    <img class="door-inside" src="assets/img/showroom/showroom-m.jpg" alt="" fetchpriority="low">
    <div class="door-copy">
      <h1 id="hero-title" data-c="hero_title"></h1>
      <span class="door-rule" aria-hidden="true"></span>
      <p data-c="hero_text"></p>
      <div class="door-actions">
        <a class="btn btn-brand" href="showroom.html" data-door-enter data-ui="enter_showroom">Explore Products</a>
      </div>
    </div>
  </section>

<script src="assets/js/home-door.js" defer></script>
