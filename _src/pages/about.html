<!--
title: About Us | Sailing International Trade
description: Sailing International Trade supplies architectural glass, mirrors and related products, with glass manufacturing roots in Qingdao, China since 1993 and a sales office in Toronto.
nav: about
image: assets/img/site/hero-about-door.jpg
-->
<link rel="stylesheet" href="assets/css/journey.css">
  <section class="page-hero" aria-labelledby="page-title">
    <img class="hero-bg" src="{{image}}" data-c-src="hero_image" alt="" fetchpriority="high">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-ui="nav_home">Home</a><span aria-hidden="true">/</span><span data-ui="nav_about">About Us</span></nav>
      <h1 id="page-title" data-c="hero_title"></h1>
      <p data-c="hero_text"></p>
    </div>
  </section>

  <section class="split-row" aria-labelledby="story-title">
    <div class="split-text reveal">
      <h2 class="h-up" id="story-title" data-c="story_title"></h2>
      <p data-c="story_text"></p>
      <p data-c="story_text2"></p>
      <div class="stat-row">
        <div><strong data-set="since"></strong><span data-ui="since_label"></span></div>
      </div>
    </div>
    <div class="split-media"><img data-c-src="story_image" alt="" loading="lazy"></div>
  </section>

  <section class="sec sec-gray" aria-labelledby="values-title">
    <div class="container center">
      <h2 class="h-up reveal" id="values-title" data-c="values_title"></h2>
      <div class="pillars pillars-4" id="values"></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="services-title">
    <div class="container">
      <h2 class="h-up center reveal" id="services-title" data-c="services_title"></h2>
      <div class="service-grid" id="about-services"></div>
    </div>
  </section>

  <!-- Market presence: 3D globe drawn by assets/js/globe.js; markets and figures come from content/pages/about.json -->
  <section class="sec market" id="market" aria-labelledby="market-title">
    <div class="container market-grid">
      <div class="market-copy reveal">
        <span class="market-eyebrow" data-c="market_eyebrow"></span>
        <h2 class="h-up" id="market-title" data-c="market_title"></h2>
        <p class="market-text" data-c="market_text"></p>
        <div class="market-stats" id="market-stats"></div>
      </div>
      <div class="market-list reveal" id="market-list"></div>
      <div class="globe-wrap reveal">
        <canvas class="globe" aria-hidden="true"></canvas>
        <div class="globe-labels" id="globe-labels" aria-hidden="true"></div>
        <p class="globe-hint" data-c="market_hint"></p>
      </div>
    </div>
  </section>

  <!-- Our milestones: a boat sails along a gold route from stop to stop while the visitor scrolls (or picks a year);
       the 2027 plan sits apart by a lighthouse, marked "Planned". Phones: a vertical timeline.
       Behaviour in assets/js/journey.js, look in assets/css/journey.css, texts in content/pages/about.json (milestones, vision). -->
  <section class="jr" id="journey" aria-labelledby="journey-title">
    <div class="jr-track" id="jr-track">
      <div class="jr-stage">
        <div class="container">
          <div class="jr-head">
            <div>
              <span class="jr-eyebrow" data-c="journey_eyebrow"></span>
              <h2 class="h-up" id="journey-title" data-c="journey_title"></h2>
            </div>
            <p class="jr-lede" data-c="journey_text"></p>
            <div class="jr-ctrl">
              <button type="button" id="jr-prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
              <button type="button" id="jr-next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
          </div>
          <div class="jr-scene" id="jr-scene">
            <div class="jr-years" id="jr-years" role="tablist" aria-labelledby="journey-title"></div>
            <svg class="jr-map" viewBox="0 0 1200 400" aria-hidden="true">
              <path class="jr-route-dim" id="jr-route-dim"/><path class="jr-route-plan" id="jr-route-plan"/><path class="jr-route-on" id="jr-route-on"/>
            </svg>
            <div class="jr-light" aria-hidden="true"><svg viewBox="0 0 110 160">
              <path class="beam" d="M44 50L-34 22L-30 88Z" fill="#FFF0BD"/><path class="beam" d="M77 50L150 26L148 86Z" fill="#FFF0BD"/>
              <path d="M49 65L38 151H84L73 65Z" fill="#EDE0CD"/><path d="M45 90H78M42 115H82" stroke="#AA8A70" stroke-width="2"/>
              <path d="M41 65H80L74 53H47Z" fill="#8C74B0"/><path class="lamp" d="M47 42H75V55H47Z" fill="#F2D594"/>
              <path d="M41 42L61 23L82 42Z" fill="#D9CDE8"/><path d="M61 23V11" stroke="#D9CDE8" stroke-width="2"/>
              <path d="M49 151H35L30 160H92L87 151Z" fill="#4A3A63"/></svg></div>
            <div class="jr-stops" id="jr-stops"></div>
            <div class="jr-boat" id="jr-boat" aria-hidden="true"><svg viewBox="0 0 100 90">
              <path class="b-mast" d="M49 12V66"/><path class="b-sail" d="M46 14Q12 38 19 61L46 63Z"/><path class="b-sail2" d="M54 22Q82 45 70 60L54 63Z"/>
              <path class="b-hull" d="M11 67Q45 83 89 68Q76 90 27 82Z"/><path class="b-wake" d="M6 84Q48 93 94 81"/></svg></div>
          </div>
          <div class="jr-card" id="jr-card" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <div class="container"><ol class="jr-list" id="jr-list"></ol></div>
  </section>

  <section class="sec sec-gray" aria-labelledby="serve-title">
    <div class="container">
      <h2 class="h-up center reveal" id="serve-title" data-c="serve_title"></h2>
      <div class="photo-cards" id="serve"></div>
    </div>
  </section>

<!-- include: cta -->
<script src="assets/js/globe.js" defer></script>
<script src="assets/js/journey.js" defer></script>
