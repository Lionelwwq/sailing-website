<!--
title: About Us | Sailing International Trade
description: Sailing International Trade has supplied custom glass, mirrors, installation and glass industry accessories in Toronto since 1993.
nav: about
image: assets/img/site/hero-about-door.jpg
-->
  <section class="page-hero" aria-labelledby="page-title">
    <img class="hero-bg" src="{{image}}" data-c-src="hero_image" alt="" fetchpriority="high">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-ui="nav_home">Home</a><span aria-hidden="true">/</span><span data-ui="nav_about">About Us</span></nav>
      <h1 id="page-title" data-c="hero_title"></h1>
      <p data-c="hero_text"></p>
    </div>
  </section>

  <section class="split-row" aria-labelledby="story-title">
    <div class="split-text reveal">
      <h2 class="h-up" id="story-title" data-c="story_title"></h2>
      <p data-c="story_text"></p>
      <p data-c="story_text2"></p>
      <div class="stat-row">
        <div><strong data-set="since"></strong><span data-ui="since_label"></span></div>
      </div>
    </div>
    <div class="split-media"><img data-c-src="story_image" alt="" loading="lazy"></div>
  </section>

  <section class="sec sec-gray" aria-labelledby="values-title">
    <div class="container center">
      <h2 class="h-up reveal" id="values-title" data-c="values_title"></h2>
      <p class="lead-strong values-motto reveal" data-c="values_motto"></p>
      <div class="pillars pillars-4" id="values"></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="services-title">
    <div class="container">
      <h2 class="h-up center reveal" id="services-title" data-c="services_title"></h2>
      <div class="service-grid" id="about-services"></div>
    </div>
  </section>

  <!-- Market presence: 3D globe drawn by assets/js/globe.js; markets and figures come from content/pages/about.json -->
  <section class="sec market" id="market" aria-labelledby="market-title">
    <div class="container market-grid">
      <div class="market-copy reveal">
        <span class="market-eyebrow" data-c="market_eyebrow"></span>
        <h2 class="h-up" id="market-title" data-c="market_title"></h2>
        <p class="market-text" data-c="market_text"></p>
        <div class="market-stats" id="market-stats"></div>
      </div>
      <div class="market-list reveal" id="market-list"></div>
      <div class="globe-wrap reveal">
        <canvas class="globe" aria-hidden="true"></canvas>
        <div class="globe-labels" id="globe-labels" aria-hidden="true"></div>
        <p class="globe-hint" data-c="market_hint"></p>
      </div>
    </div>
  </section>

  <section class="sec sec-gray" aria-labelledby="serve-title">
    <div class="container">
      <h2 class="h-up center reveal" id="serve-title" data-c="serve_title"></h2>
      <div class="photo-cards" id="serve"></div>
    </div>
  </section>

<!-- include: cta -->
<script src="assets/js/globe.js" defer></script>
