<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F1EE"/><stop offset="1" stop-color="#E4E0DA"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9D6CF"/><stop offset=".5" stop-color="#A9A396"/><stop offset="1" stop-color="#7D7566"/></linearGradient>
    <filter id="patina" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .016" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .32  0 0 0 0 .27  0 0 0 0 .2  0 0 0 -2.2 1.35" result="spots"/>
      <feComposite in="spots" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="fleck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .95  0 0 0 0 .93  0 0 0 0 .88  0 0 0 -3 1.6" result="f"/>
      <feComposite in="f" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="690" rx="300" ry="24" fill="url(#floor)"/>
  <rect x="150" y="110" width="500" height="570" rx="4" fill="#5C5446"/>
  <rect x="164" y="124" width="472" height="542" fill="url(#silver)"/>
  <rect x="164" y="124" width="472" height="542" fill="#fff" filter="url(#patina)"/>
  <rect x="164" y="124" width="472" height="542" fill="#fff" filter="url(#fleck)" opacity=".7"/>
  <polygon points="230,124 320,124 164,380 164,230" fill="url(#shine)"/>
</svg>
